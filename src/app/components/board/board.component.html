@defer (when board().length > 0; prefetch on immediate) {
    <app-team [team]="board()"></app-team>
} @placeholder (minimum 100ms) {
    <app-loading></app-loading>
    @if (failedFetching()) {
        <button class="global-fetch-failed-button" (click)="getBoard()">Erneut versuchen</button>
    }
}
